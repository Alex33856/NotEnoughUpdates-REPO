name: comment_failure.yml
on:
  workflow_run:
    workflows: [ "Check Files" ]
    types: [ completed ]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment_failure:
    runs-on: ubuntu-latest
    # if: github.event.workflow_run.conclusion == 'failure
    steps:
      - name: Check for Summary
        uses: actions/github-script@v9
        with:
          script: |
            console.log(${{github.event}})

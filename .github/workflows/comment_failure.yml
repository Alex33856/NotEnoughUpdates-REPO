name: Comment Failure
on:
  workflow_run:
    workflows: [ "Check Files" ]
    types: [ completed ]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment_failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' # &&  github.event.workflow_run.conclusion == 'failure
    steps:
      - name: Print Event
        run: echo "$EVENT"
        env:
          EVENT: ${{ toJSON(github.event) }}
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: pr_data
          path: ${{ runner.temp }}/artifacts
          run-id: ${{ github.event.workflow_run.id }}
      - name: Find Job ID
        id: job-id
        uses: actions/github-script@v9
        with:
          script: |
            const response = await github.action.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id}}
            });
            return response.data.jobs.find(job => job.name === 'check')?.id;
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            // Boilerplate code to get PR Number from artifact
            const fs = require('fs');
            const path = require('path);
            const temp = '${{ runner.temp }}/artifacts';
            const issue_number_raw = fs.readFileSync(path.join(temp, 'pr_number'), 'utf8').trim();
            const issue_number = Number(issue_number_raw);
            if (!Number.isInteger(issue_number)) {
              throw new Error(`Invalid PR number in pr_number artifact: "${issue_number_raw}"`);
            }
            
            const baseUrl = "${{ github.event.workflow_run.html_url }}/attempts/${{ github.event.workflow_run.run_attempt }}";
            
            const summaryUrl = baseUrl + "#summary-${{ steps.job-id.outputs.result }}";
            const logUrl = baseUrl + "/job/${{ steps.job-id.outputs.result }}";
            await github.action.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `I've detected some problems you might want to take a look at, you can see them in the [Workflow Summary](${summaryUrl}) or [Workflow Log](${logUrl}).`
            });
